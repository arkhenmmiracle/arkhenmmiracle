<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Tactics Board — 4-2-3-1 Tech Formation</title>
<desc id="desc">A vertical football pitch with the opponent goal at the top and own goal at the bottom.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset=".5" stop-color="#082D5D"/><stop offset="1" stop-color="#020B1E"/></linearGradient>
 <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D62CF"/><stop offset="1" stop-color="#073678"/></linearGradient>
 <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
 <pattern id="stripes" width="160" height="160" patternUnits="userSpaceOnUse"><rect width="80" height="160" fill="#0B315D" opacity=".17"/><rect x="80" width="80" height="160" fill="#071F42" opacity=".17"/></pattern>
</defs>
<rect width="1100" height="760" rx="24" fill="#0D1117"/>
<rect x="20" y="20" width="1060" height="720" rx="18" fill="url(#bg)" stroke="#334963" stroke-width="2"/>
<!-- vertical pitch -->
<rect x="58" y="78" width="984" height="624" rx="7" fill="url(#stripes)" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<line x1="58" y1="390" x2="1042" y2="390" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<circle cx="550" cy="390" r="74" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<circle cx="550" cy="390" r="5" fill="#71869E" opacity=".75"/>
<!-- opponent goal and penalty area: top -->
<rect x="455" y="54" width="190" height="24" fill="none" stroke="#9CB0C6" stroke-width="4"/>
<path d="M455 54l18-18h154l18 18M473 36v18M627 36v18" fill="none" stroke="#9CB0C6" stroke-width="3"/>
<rect x="305" y="78" width="490" height="132" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<rect x="430" y="78" width="240" height="58" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<path d="M466 210a92 92 0 0 0 168 0" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<circle cx="550" cy="170" r="4" fill="#71869E"/>
<!-- own goal and penalty area: bottom -->
<rect x="455" y="702" width="190" height="24" fill="none" stroke="#9CB0C6" stroke-width="4"/>
<path d="M455 726l18 18h154l18-18M473 726v18M627 726v18" fill="none" stroke="#9CB0C6" stroke-width="3"/>
<rect x="305" y="570" width="490" height="132" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<rect x="430" y="644" width="240" height="58" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<path d="M466 570a92 92 0 0 1 168 0" fill="none" stroke="#71869E" stroke-opacity=".72" stroke-width="3"/>
<circle cx="550" cy="610" r="4" fill="#71869E"/>
<!-- header -->
<rect x="42" y="25" width="370" height="47" rx="10" fill="#031229" opacity=".96"/>
<text x="66" y="56" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#59A1FF" letter-spacing="2">⚙ TACTICS BOARD</text>
<text x="416" y="56" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#93C5FD">(TECH STACK)</text>
<text x="1040" y="56" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#F4C95D">ATTACK ↑</text>
<!-- connections -->
<g fill="none" stroke="#4A91E5" stroke-width="2" stroke-dasharray="7 8" opacity=".42">
 <path d="M550 145L260 270M550 145L550 270M550 145L840 270"/>
 <path d="M260 270L420 395M550 270L420 395M550 270L680 395M840 270L680 395"/>
 <path d="M420 395L190 520M420 395L430 520M680 395L670 520M680 395L910 520"/>
 <path d="M190 520L550 650M430 520L550 650M670 520L550 650M910 520L550 650"/>
</g>
<!-- 4-2-3-1 formation -->
<g font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" filter="url(#shadow)">
 <!-- striker -->
 <rect x="475" y="112" width="150" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="550" y="142">Next.js</text>
 <!-- three attacking mids -->
 <rect x="180" y="246" width="160" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="260" y="276">React</text>
 <rect x="460" y="246" width="180" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="550" y="276">TypeScript</text>
 <rect x="750" y="246" width="180" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="840" y="276">React Native</text>
 <!-- two holding mids -->
 <rect x="335" y="371" width="170" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="420" y="401">Node.js</text>
 <rect x="590" y="371" width="180" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="680" y="401">PostgreSQL</text>
 <!-- back four -->
 <rect x="110" y="496" width="160" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="190" y="526">REST API</text>
 <rect x="350" y="496" width="160" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="430" y="526">Prisma</text>
 <rect x="575" y="496" width="190" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="670" y="526">Git &amp; GitHub</text>
 <rect x="830" y="496" width="160" height="48" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="910" y="526">Docker</text>
 <!-- goalkeeper -->
 <rect x="460" y="626" width="180" height="48" rx="12" fill="#A87900" stroke="#F4C95D"/><text x="550" y="656">Deployment</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="13">
 <text x="76" y="100" fill="#8EB8E8">OPPONENT GOAL</text>
 <text x="76" y="684" fill="#8EB8E8">OWN GOAL</text>
 <text x="1025" y="684" text-anchor="end" fill="#8EB8E8">4–2–3–1 DIGITAL FORMATION</text>
</g>
</svg>