  <circle cx="1010" cy="160" r="116"/><circle cx="1010" cy="160" r="93"/>
  <path d="M70 62h370M760 262h370"/>
</g>

<g transform="translate(820 28)" filter="url(#shadow)">
  <circle cx="160" cy="132" r="112" fill="#06183D" stroke="#8ECBFF" stroke-width="4"/>
  <circle cx="160" cy="132" r="96" fill="#034694" stroke="#D6B04B" stroke-width="3"/>
  <!-- original geometric heraldic lion -->
  <path d="M147 61l18-19 17 20 26-8-4 28c25 17 37 43 32 72-4 28-23 51-49 62l-9-23 18-15-12-13-17 13-7 42h-23l-5-51-19 18-20-12 20-25-18-9 8-22 25 7-5-27 24 9-4-27z" fill="#F4C95D"/>
  <path d="M133 91c18-17 44-17 59 1-20-3-33 7-38 25-7-12-14-19-21-26z" fill="#06183D"/>
  <circle cx="174" cy="92" r="4" fill="#8ECBFF"/>
  <path d="M194 82l17-16 4 25zM122 76l-17-17 1 28z" fill="#F4C95D"/>
  <path d="M105 53l16-22 14 20 21-26 19 26 19-20 12 24z" fill="#F4C95D" stroke="#06183D" stroke-width="3"/>
  <circle cx="120" cy="42" r="4" fill="#8ECBFF"/><circle cx="156" cy="36" r="4" fill="#8ECBFF"/><circle cx="192" cy="42" r="4" fill="#8ECBFF"/>
</g>

<g fill="#fff">
  <text x="82" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#8ECBFF">HELLO, I'M</text>
  <text x="78" y="172" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="1">ARKHEN</text>
  <text x="82" y="216" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#D9ECFF">FULL-STACK DEVELOPER</text>
  <text x="82" y="260" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="#AFCFF2">BUILDING DIGITAL PRODUCTS  •  BACKING THE BLUES</text>
