<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Arkhen blue lion developer banner</title>
<desc id="desc">A royal blue developer banner with an original heraldic lion emblem.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#020B2D"/>
    <stop offset=".52" stop-color="#034694"/>
    <stop offset="1" stop-color="#05245F"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#6CB8FF" stop-opacity=".42"/>
    <stop offset="1" stop-color="#034694" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>

<rect width="1200" height="320" rx="28" fill="url(#bg)"/>
<circle cx="1000" cy="40" r="230" fill="url(#glow)"/>
<circle cx="170" cy="285" r="230" fill="url(#glow)"/>
<path d="M0 255C190 215 315 300 495 257S830 205 1200 248V320H0Z" fill="#071737" opacity=".65"/>
