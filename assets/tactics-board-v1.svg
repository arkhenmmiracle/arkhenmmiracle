<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Tactics Board — Tech Stack Formation</title>
<desc id="desc">A football tactics board showing Arkhen's technology stack positioned as players.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061326"/><stop offset=".48" stop-color="#082B57"/><stop offset="1" stop-color="#020B1E"/></linearGradient>
 <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C5DC4"/><stop offset="1" stop-color="#073678"/></linearGradient>
 <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
 <pattern id="grass" width="120" height="120" patternUnits="userSpaceOnUse"><rect width="60" height="120" fill="#0B315D" opacity=".16"/><rect x="60" width="60" height="120" fill="#071F42" opacity=".16"/></pattern>
</defs>
<rect width="1200" height="570" rx="24" fill="#0D1117"/>
<rect x="20" y="20" width="1160" height="530" rx="18" fill="url(#bg)" stroke="#334963" stroke-width="2"/>
<rect x="40" y="40" width="1120" height="490" rx="8" fill="url(#grass)" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<!-- football pitch -->
<line x1="600" y1="40" x2="600" y2="530" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<circle cx="600" cy="285" r="78" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<circle cx="600" cy="285" r="5" fill="#71869E" opacity=".7"/>
<rect x="40" y="145" width="168" height="280" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<rect x="40" y="205" width="72" height="160" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<path d="M208 220a78 78 0 0 1 0 130" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<rect x="992" y="145" width="168" height="280" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<rect x="1088" y="205" width="72" height="160" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<path d="M992 220a78 78 0 0 0 0 130" fill="none" stroke="#71869E" stroke-opacity=".62" stroke-width="3"/>
<!-- title -->
<rect x="48" y="48" width="348" height="48" rx="10" fill="#031229" opacity=".9"/>
<text x="72" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#59A1FF" letter-spacing="2">⚙ TACTICS BOARD</text>
<text x="407" y="79" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#93C5FD">(TECH STACK)</text>
<!-- connector paths -->
<g fill="none" stroke="#4A91E5" stroke-width="2" stroke-dasharray="7 8" opacity=".38">
 <path d="M600 138L330 225M600 138L600 225M600 138L870 225"/>
 <path d="M330 225L445 330M600 225L445 330M600 225L755 330M870 225L755 330"/>
 <path d="M445 330L240 425M445 330L500 425M755 330L700 425M755 330L960 425"/>
 <path d="M240 425L600 493M500 425L600 493M700 425L600 493M960 425L600 493"/>
</g>
<!-- chips -->
<g font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle" filter="url(#shadow)">
 <!-- striker -->
 <rect x="520" y="112" width="160" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/>
 <text x="600" y="145">Next.js</text>
 <!-- attacking midfield -->
 <rect x="245" y="199" width="170" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="330" y="232">React</text>
 <rect x="505" y="199" width="190" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="600" y="232">TypeScript</text>
 <rect x="775" y="199" width="190" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="870" y="232">React Native</text>
 <!-- midfield -->
 <rect x="360" y="304" width="170" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="445" y="337">Node.js</text>
 <rect x="665" y="304" width="180" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="755" y="337">PostgreSQL</text>
 <!-- defence -->
 <rect x="155" y="399" width="170" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="240" y="432">REST API</text>
 <rect x="420" y="399" width="160" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="500" y="432">Prisma</text>
 <rect x="610" y="399" width="180" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="700" y="432">Git &amp; GitHub</text>
 <rect x="880" y="399" width="160" height="52" rx="12" fill="url(#chip)" stroke="#4497FF"/><text x="960" y="432">Docker</text>
 <!-- goalkeeper -->
 <rect x="510" y="467" width="180" height="52" rx="12" fill="#A87900" stroke="#F4C95D"/><text x="600" y="500">Deployment</text>
</g>
<text x="1140" y="518" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#6F8FB5">4–2–3–1 DIGITAL FORMATION</text>
</svg>